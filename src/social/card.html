<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Share card source</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Source of assets/og-card.png (1200x630). Regenerate with tools/make-social-images.ps1 */
html,body{margin:0;padding:0;background:#0F2A2E}
.card{position:absolute;left:0;top:0;width:1200px;height:630px;overflow:hidden;background:linear-gradient(135deg,#0F2A2E 0%,#0B1E21 100%);color:#F2EFE6;font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif;direction:rtl}
.pat{position:absolute;inset:0;opacity:.11}
.inner{position:absolute;inset:0;padding:64px 84px;display:flex;flex-direction:column;justify-content:center;gap:20px}
.badge{align-self:flex-start;border:2px solid rgba(242,239,230,.45);border-radius:99px;padding:6px 26px;font-size:28px;color:rgba(242,239,230,.9)}
h1{font-family:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;font-size:156px;line-height:1.2;margin:0;font-weight:700;letter-spacing:0}
.sub{font-size:46px;color:#E0B25A;font-weight:600}
.line{font-size:32px;color:rgba(242,239,230,.82);max-width:860px;line-height:1.7}
.mark{position:absolute;left:72px;bottom:56px;width:150px;height:150px}
</style>
</head>
<body>
<div class="card">
  <svg class="pat" width="1200" height="630" aria-hidden="true"><defs><pattern id="p" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M28 4 L52 28 L28 52 L4 28 Z" fill="none" stroke="#F2EFE6" stroke-width="1.2"/><circle cx="28" cy="28" r="6" fill="none" stroke="#F2EFE6" stroke-width="1"/></pattern></defs><rect width="100%" height="100%" fill="url(#p)"/></svg>
  <svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 6 L58 32 L32 58 L6 32 Z" fill="none" stroke="#F2EFE6" stroke-width="2.4"/><circle cx="32" cy="32" r="9" fill="#E0B25A"/></svg>
  <div class="inner">
    <span class="badge">المستوى الثاني · المرحلة الثالثة</span>
    <h1>البناء المنهجي</h1>
    <div class="sub">دفعة البشائر</div>
    <div class="line">ملخصات المواد بالرسوم التوضيحية وأسئلة المراجعة</div>
  </div>
</div>
</body>
</html>
